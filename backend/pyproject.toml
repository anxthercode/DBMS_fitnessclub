[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "northside-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "asyncpg>=0.30,<1",
  "pydantic-settings>=2.7,<3", "alembic>=1.14,<2", "sqlalchemy[asyncio]>=2.0,<3",
  "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3", "tzdata>=2025.1",
  "python-docx>=1.1,<2", "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the explicit dedicated TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.setuptools.package-data]
"app.reports" = ["assets/*.ttf", "assets/*.txt"]
